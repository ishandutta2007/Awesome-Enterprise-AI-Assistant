x="960" cy="220" r="4" fill="#818cf8"/></g><circle cx="180" cy="80" r="3" fill="#38bdf8" class="particle-1"/><circle cx="1040" cy="90" r="4" fill="#c084fc" class="particle-2"/><circle cx="920" cy="320" r="3" fill="#06b6d4" class="particle-3"/><circle cx="260" cy="330" r="4" fill="#818cf8" class="particle-1"/><g class="floating-element-3" transform="translate(80, 320)"><rect width="180" height="38" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="19"/><circle cx="24" cy="19" r="6" fill="#10b981"/><text x="40" y="24" class="pill-text">RAG &amp; Vector Search</text></g><g class="floating-element-1" transform="translate(940, 320)"><rect width="180" height="38" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" rx="19"/><circle cx="24" cy="19" r="6" fill="#8b5cf6"/><text x="40" y="24" class="pill-text">Agentic Workflows</text></g><g transform="translate(600, 85)"><rect width="240" height="32" x="-120" y="-18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="16"/><text x="0" y="3" class="badge-text" text-anchor="middle">⚡ ENTERPRISE AI DIRECTORY 2026</text></g><text x="600" y="165" class="title" filter="url(#textGlow)" text-anchor="middle">Awesome Enterprise AI Assistant</text><text x="600" y="220" class="subtitle" text-anchor="middle">Curated Commercial Platforms &amp; Self-Hosted Open-Source Frameworks</text><g><text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" transform="translate(600, 265)"><tspan fill="#38bdf8">Enterprise Search</tspan> • <tspan fill="#818cf8">Knowledge Grounding</tspan> • <tspan fill="#c084fc">Self-Hosted RAG</tspan> • <tspan fill="#34d399">AI Governance</tspan></text></g></svg>