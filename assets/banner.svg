<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #93c5fd; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic Animations */
    @keyframes float1 { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(1deg); } }
    @keyframes float2 { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(10px) rotate(-1deg); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    @keyframes dash { to { stroke-dashoffset: -40; } }

    .animated-node-1 { animation: float1 6s ease-in-out infinite; }
    .animated-node-2 { animation: float2 7s ease-in-out infinite; }
    .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; }
    .flowing-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Background Orbs (Behind content) -->
  <circle cx="200" cy="100" r="160" fill="#0284c7" opacity="0.25" class="pulse-bg" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="180" fill="#6366f1" opacity="0.25" class="pulse-bg" filter="url(#glow)" />

  <!-- Background Dynamic Network Flow (Behind Text Layer) -->
  <g opacity="0.4">
    <!-- Network paths -->
    <path d="M 100 320 Q 300 380 500 320 T 900 340 T 1100 280" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flowing-line"/>
    <path d="M 50 120 Q 350 40 650 100 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" class="flowing-line"/>

    <!-- Dynamic Flow Cards / Micro-visuals in Background -->
    <g class="animated-node-1" transform="translate(860, 60)">
      <rect width="240" height="70" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <circle cx="30" cy="35" r="16" fill="#0284c7" opacity="0.8"/>
      <text x="30" y="40" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">⚡</text>
      <rect x="60" y="22" width="110" height="8" rx="4" fill="#93c5fd" opacity="0.8"/>
      <rect x="60" y="38" width="70" height="6" rx="3" fill="#64748b"/>
    </g>

    <g class="animated-node-2" transform="translate(890, 250)">
      <rect width="220" height="80" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <circle cx="30" cy="40" r="16" fill="#6366f1" opacity="0.8"/>
      <text x="30" y="45" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">🧠</text>
      <rect x="60" y="26" width="120" height="8" rx="4" fill="#c084fc" opacity="0.8"/>
      <rect x="60" y="42" width="85" height="6" rx="3" fill="#64748b"/>
    </g>
  </g>

  <!-- FOREGROUND CONTENT LAYER (Guaranteed no overlap/hiding) -->
  <g transform="translate(80, 0)">
    <!-- Top pill badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="34" rx="17" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <text x="140" y="22" class="badge-text" text-anchor="middle">🤖 ENTERPRISE AI ECOSYSTEM 🤖</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="175" class="title" filter="url(#glow)">Awesome Enterprise AI Assistant</text>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle">Curated Directory of Enterprise AI Platforms, Knowledge Grounding & Open-Source RAG</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="140" height="32" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="70" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🏢 Commercial SaaS</text>

      <rect x="155" y="0" width="155" height="32" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="232" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔓 Open-Source RAG</text>

      <rect x="325" y="0" width="165" height="32" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="407" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🧠 Agentic Workflows</text>

      <rect x="505" y="0" width="160" height="32" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="585" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔒 Self-Hosted Privacy</text>
    </g>
  </g>
</svg>
