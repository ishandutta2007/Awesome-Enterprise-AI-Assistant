<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #cbd5e1;
    }

    /* CSS Animations for Dynamic Aspects */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .bg-glow-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-glow-2 { animation: pulseGlow 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 2.5s; }

    .data-stream { stroke-dasharray: 8 12; animation: dashCycle 3s linear infinite; }
    .floating-element-1 { animation: floatCard 5s ease-in-out infinite; }
    .floating-element-2 { animation: floatCard 6s ease-in-out infinite 1.5s; }
    .floating-element-3 { animation: floatCard 5.5s ease-in-out infinite 0.7s; }
  </style>

  <!-- Base Dark Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/>

  <!-- Dynamic Glowing Background Orbs (Behind everything) -->
  <circle class="bg-glow-1" cx="200" cy="100" r="300" fill="url(#glowCyan)"/>
  <circle class="bg-glow-2" cx="1000" cy="300" r="350" fill="url(#glowPurple)"/>

  <!-- Animated Tech Grid Pattern (Background layer) -->
  <g opacity="0.1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#38bdf8" stroke-width="1"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Animated Data Streams / Connecting Nodes (Flanking Sides - keeps center free) -->
  <!-- Left Graphic Structure -->
  <g class="floating-element-1" opacity="0.65">
    <path class="data-stream" d="M 60,180 L 150,120 L 220,200 L 140,280 Z" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="60" cy="180" r="4" fill="#38bdf8"/>
    <circle cx="150" cy="120" r="5" fill="#818cf8"/>
    <circle cx="220" cy="200" r="4" fill="#c084fc"/>
    <circle cx="140" cy="280" r="5" fill="#06b6d4"/>
  </g>

  <!-- Right Graphic Structure -->
  <g class="floating-element-2" opacity="0.65">
    <path class="data-stream" d="M 980,120 L 1120,160 L 1060,260 L 960,220 Z" fill="none" stroke="#818cf8" stroke-width="2"/>
    <circle cx="980" cy="120" r="5" fill="#38bdf8"/>
    <circle cx="1120" cy="160" r="4" fill="#c084fc"/>
    <circle cx="1060" cy="260" r="6" fill="#38bdf8"/>
    <circle cx="960" cy="220" r="4" fill="#818cf8"/>
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="180" cy="80" r="3" fill="#38bdf8"/>
  <circle class="particle-2" cx="1040" cy="90" r="4" fill="#c084fc"/>
  <circle class="particle-3" cx="920" cy="320" r="3" fill="#06b6d4"/>
  <circle class="particle-1" cx="260" cy="330" r="4" fill="#818cf8"/>

  <!-- SIDE CARDS / PILLS (Positioned low/top flanking, zero overlap with center text) -->
  <!-- Bottom Left Pill -->
  <g class="floating-element-3" transform="translate(80, 320)">
    <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="24" cy="19" r="6" fill="#10b981"/>
    <text x="40" y="24" class="pill-text">RAG &amp; Vector Search</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-element-1" transform="translate(940, 320)">
    <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1"/>
    <circle cx="24" cy="19" r="6" fill="#8b5cf6"/>
    <text x="40" y="24" class="pill-text">Agentic Workflows</text>
  </g>

  <!-- FOREGROUND CONTENT CONTAINER (Strict Z-index placement above all dynamic elements) -->
  <!-- Top Badge -->
  <g transform="translate(600, 85)">
    <rect x="-120" y="-18" width="240" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" class="badge-text">⚡ ENTERPRISE AI DIRECTORY 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" class="title" filter="url(#textGlow)">Awesome Enterprise AI Assistant</text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="220" text-anchor="middle" class="subtitle">Curated Commercial Platforms &amp; Self-Hosted Open-Source Frameworks</text>

  <!-- Subtitle Line 2 (Feature Tags) -->
  <g transform="translate(600, 265)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      <tspan fill="#38bdf8">Enterprise Search</tspan> • 
      <tspan fill="#818cf8">Knowledge Grounding</tspan> • 
      <tspan fill="#c084fc">Self-Hosted RAG</tspan> • 
      <tspan fill="#34d399">AI Governance</tspan>
    </text>
  </g>

</svg>
